<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% if page.title %}
            {{ page.title }} — {{ site.title }}
        {% else %}
            {{ site.title }}
        {% endif %}
    </title>

    <meta name="description"
          content="{{ site.description }}">

    <link rel="stylesheet"
          href="{{ '/assets/css/style.css' | relative_url }}">

</head>


<body>

    <nav>

        <div class="container nav-inner">

            <a href="{{ '/' | relative_url }}"
               class="logo">

                Thinking Better

            </a>


            <div class="nav-links">

                <a href="{{ '/about/' | relative_url }}">
                    About
                </a>

                <a href="{{ '/projects/' | relative_url }}">
                    Projects
                </a>

                <a href="{{ '/writing/' | relative_url }}">
                    Writing
                </a>

                <a href="{{ '/notes/' | relative_url }}">
                    Notes
                </a>

                <a href="{{ '/books/' | relative_url }}">
                    Books
                </a>

            </div>

        </div>

    </nav>


    <main>

        {{ content }}

    </main>


    <footer>

        <div class="container footer-inner">

            <div>
                © {{ site.time | date: "%Y" }}
                Athul · Thinking Better
            </div>


            <div class="footer-links">

                <a href="https://github.com/thinking-better">
                    GitHub
                </a>

                <a href="#">
                    LinkedIn
                </a>

            </div>

        </div>

    </footer>


</body>

</html>
